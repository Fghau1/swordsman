# ============================================================
#              🩸 KITTY — BERSERK
# ============================================================

font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

# ------------------------------------------------------------
# WINDOW
# ------------------------------------------------------------

window_padding_width 15

background_opacity 0.95

hide_window_decorations yes

confirm_os_window_close 0

# ------------------------------------------------------------
# CURSOR
# ------------------------------------------------------------

cursor_shape block
cursor_blink_interval 0

cursor #8B0000
cursor_text_color #D6D0C4

# ------------------------------------------------------------
# BERSERK DARKNESS
# ------------------------------------------------------------

background #0B0B0B
foreground #D6D0C4

selection_foreground #0B0B0B
selection_background #8B0000

# ------------------------------------------------------------
# BERSERK PALETTE
# ------------------------------------------------------------

# Black
color0  #0B0B0B
color8  #3A3A3A

# Blood red
color1  #8B0000
color9  #B30000

# Dark green / muted
color2  #30352B
color10 #4B5542

# Bronze
color3  #80652F
color11 #A88A4A

# Iron blue
color4  #29343A
color12 #4A5961

# Dark crimson
color5  #4A1C22
color13 #762A34

# Dark steel
color6  #30383A
color14 #586365

# Bone
color7  #AAA49A
color15 #D6D0C4
