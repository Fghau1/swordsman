#############################################
#        🩸 BERSERK — PICOM
#############################################

backend = "glx";
vsync = true;

#############################################
# SHADOWS
#############################################

shadow = true;

shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.35;

#############################################
# CORNERS
#############################################

corner-radius = 0;

#############################################
# FADING
#############################################

fading = false;

#############################################
# BLUR
#############################################

blur-background = false;

#############################################
# OPACITY
#############################################

inactive-opacity = 0.90;
active-opacity = 1.00;
frame-opacity = 1.00;

#############################################
# GENERAL
#############################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-damage = true;

#############################################
# WINDOW OPACITY
#############################################

opacity-rule = [

    # Rofi
    "100:class_g = 'Rofi'",

    # Polybar
    "100:class_g = 'Polybar'",

    # Kitty
    "95:class_g = 'kitty' && focused",
    "88:class_g = 'kitty' && !focused"
];
